{% extends "base.html" %}
{% block title %}Blog · Davem Cyber Consulting{% endblock %}
{% block content %}
<section class="page-head">
  <div class="wrap">
    <h1>Blog</h1>
    <p class="lead">Notas breves sobre normativa y seguridad, en lenguaje claro.</p>
  </div>
</section>
<section class="wrap">
  <ul class="post-list">
    {% for p in posts %}
    <li>
      <p class="meta"><time datetime="{{ p.fecha }}">{{ p.fecha }}</time></p>
      <h2><a href="{{ url_for('main.blog_post', slug=p.slug) }}">{{ p.titulo }}</a></h2>
      <p>{{ p.resumen }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
