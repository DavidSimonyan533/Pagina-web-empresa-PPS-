{% extends "base.html" %}
{% block title %}{{ post.titulo }} · Davem Cyber Consulting{% endblock %}
{% block content %}
<article class="wrap prose article">
  <p class="meta"><time datetime="{{ post.fecha }}">{{ post.fecha }}</time></p>
  <h1>{{ post.titulo }}</h1>
  {% for parrafo in post.cuerpo %}<p>{{ parrafo }}</p>{% endfor %}
  <p><a class="textlink" href="{{ url_for('main.blog') }}">Volver al blog</a></p>
</article>
{% endblock %}
