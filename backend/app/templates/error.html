{% extends "base.html" %}
{% block title %}{{ titulo }} · Davem Cyber Consulting{% endblock %}
{% block content %}
<section class="page-head">
  <div class="wrap">
    <p class="err-code" aria-label="Error {{ codigo }}">{% for d in codigo|string %}<span>{{ d }}</span>{% endfor %}</p>
    <h1>{{ titulo }}</h1>
    <p class="lead">{{ texto }}</p>
    <p><a class="btn btn-lg" href="{{ url_for('main.index') }}">Volver al inicio</a></p>
  </div>
</section>
{% endblock %}
